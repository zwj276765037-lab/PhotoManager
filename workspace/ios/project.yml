name: PhotoManager

options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO

targets:
  PhotoManager:
    type: application
    platform: iOS
    sources:
      - path: PhotoManager
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zwjlab.PhotoManager
        PRODUCT_NAME: PhotoManager
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PhotoManager
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 选择原生 Live Photo，并读取其照片和配对视频来制作动态杂志封面。
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 将制作完成的动态杂志作品保存为新的 Live Photo。
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      gatherCoverageData: false
